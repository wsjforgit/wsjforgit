<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
  <rect width="1100" height="650" fill="#ffffff"/>
  <text x="70" y="65" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111111">Structured Job State: Rules vs Local AI</text>
  <text x="70" y="100" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#555555">20 real WebCodex job metadata snapshots · no upstream Codex calls</text>

  <text x="70" y="165" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#222222">Accuracy</text>
  <text x="70" y="215" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333333">Deterministic rules</text>
  <rect x="290" y="185" width="700" height="42" rx="7" fill="#222222"/>
  <text x="1010" y="213" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="end" fill="#111111">20/20 · 100%</text>

  <text x="70" y="275" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333333">Laya raw classifier</text>
  <rect x="290" y="245" width="490" height="42" rx="7" fill="#666666"/>
  <rect x="780" y="245" width="210" height="42" rx="7" fill="#dddddd"/>
  <text x="1010" y="273" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="end" fill="#111111">14/20 · 70%</text>

  <text x="70" y="360" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#222222">Median decision time</text>
  <text x="70" y="410" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333333">Deterministic rules</text>
  <text x="380" y="410" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111111">1.25 µs</text>

  <text x="70" y="465" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#333333">Laya router wall time</text>
  <text x="380" y="465" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#111111">103.64 ms</text>

  <text x="70" y="545" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111111">Engineering rule</text>
  <text x="70" y="585" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#333333">Use authoritative runtime state first. Use AI for ambiguity, not facts the runtime already knows.</text>
  <text x="70" y="620" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#777777">Benchmark scope: structured job-state classification only. Not a general AI-vs-rules claim.</text>
</svg>